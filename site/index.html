<!doctype html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbrella Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#f6f6f4;--card:#fff;--sec:#efefec;--border:#e2e2de;--soft:#ebebe8;--fg:#18181a;--muted:#62626a;--faint:#9a9aa1;--ok:#2f9a5e;--warn:#b07d1c;--accent:#18181a;--accent-fg:#fff}
.dark{--bg:#0c0c0d;--card:#121214;--sec:#19191c;--border:#222225;--soft:#1a1a1d;--fg:#ececee;--muted:#9a9aa1;--faint:#616168;--ok:#57c785;--warn:#d9a84e;--accent:#ececee;--accent-fg:#0c0c0d}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable}
body{min-height:100vh;display:flex;flex-direction:column}
main{flex:1 0 auto;width:100%}
html,body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--soft);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5}
.bar{display:flex;align-items:center;height:56px;gap:24px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px}
nav{display:flex;gap:4px}
nav a{padding:6px 10px;border-radius:7px;color:var(--muted);font-weight:500;transition:.15s}
nav a:hover{color:var(--fg);background:var(--sec)}
nav a.on{color:var(--fg);background:var(--sec)}
.sp{flex:1}
.ghost{height:32px;padding:0 10px;border-radius:8px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:.15s}
.ghost:hover{color:var(--fg);background:var(--sec)}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;padding:2px;position:relative}
.seg .knob{position:absolute;top:2px;bottom:2px;left:2px;border-radius:6px;background:var(--sec);transition:transform .3s cubic-bezier(.3,.7,.2,1),width .3s cubic-bezier(.3,.7,.2,1)}
.seg button{height:26px;padding:0 8px;border-radius:6px;color:var(--faint);font-size:12px;font-weight:600;position:relative;transition:color .25s}
.seg button.on{color:var(--fg)}
#theme i{display:inline-block;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .2s}
#theme.spin i{transform:rotate(-90deg) scale(.6);opacity:0}
.calm *{animation:none!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .55s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--x) var(--y))}to{clip-path:circle(var(--r) at var(--x) var(--y))}}
.btn{height:34px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{opacity:.88}
.btn.outline{border:1px solid var(--border)}
.btn.outline:hover{background:var(--sec)}
.page{display:none}
.page.on{display:block}
@keyframes in{from{opacity:0}}
.hero{padding:56px 0 32px}
.hero h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
.hero p{color:var(--muted);margin-top:8px;max-width:560px;font-size:15px}
.facts{display:flex;gap:40px;margin-top:28px;padding-top:20px;border-top:1px solid var(--soft)}
.fact .k{color:var(--faint);font-size:12px}
.fact .v{font-size:20px;font-weight:600;margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 14px}
.pills{display:flex;gap:4px}
.pills button{height:30px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13px}
.pills button.on{background:var(--sec);color:var(--fg)}
.pills button:hover{color:var(--fg)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:32px;border:1px solid var(--border);border-radius:8px;padding:0 10px;color:var(--faint);width:240px}
.search input{border:0;background:none;outline:none;color:var(--fg);font:inherit;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s;cursor:pointer}
.card:hover{border-color:color-mix(in srgb,var(--fg) 22%,var(--border))}
.card .top{display:flex;align-items:center;gap:12px}
.ico{width:36px;height:36px;border-radius:9px;background:var(--sec);display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.card h3{font-size:15px;font-weight:600}
.kind{font-size:12px;color:var(--faint)}
.card p{color:var(--muted);font-size:13.5px;flex:1}
.meta{display:flex;align-items:center;gap:14px;color:var(--faint);font-size:12.5px;padding-top:12px;border-top:1px solid var(--soft)}
.meta span{display:inline-flex;gap:6px;align-items:center}
.meta .dl{margin-left:auto;color:var(--fg);font-weight:500}
.chip{height:20px;padding:0 7px;border-radius:6px;background:var(--sec);color:var(--muted);font-size:11.5px;font-weight:500;display:inline-flex;align-items:center}
.chip.beta{color:var(--warn)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--faint);padding:24px 0 0;font-size:13px}
.crumb a:hover{color:var(--fg)}
.head{display:flex;gap:16px;align-items:flex-start;padding:16px 0 24px}
.head .ico{width:48px;height:48px;border-radius:11px;font-size:18px}
.head h1{font-size:24px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.head p{color:var(--muted);margin-top:2px}
.head .act{margin-left:auto;display:flex;gap:8px}
.cols{display:grid;grid-template-columns:1fr 300px;gap:32px;padding-bottom:56px}
.block{margin-bottom:28px}
.block h2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.preview{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#000;margin-bottom:28px}
.preview img{display:block;width:100%}
.lead{font-size:15px;margin-bottom:14px}
.feat{list-style:none;display:grid;gap:8px}
.feat li{display:flex;gap:10px;color:var(--muted)}
.feat li i{color:var(--faint);font-size:11px;margin-top:5px}
.steps{counter-reset:s;list-style:none;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:baseline;color:var(--muted)}
.steps li:before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:6px;background:var(--sec);color:var(--fg);font-size:12px;font-weight:600;display:inline-grid;place-items:center;flex-shrink:0}
code{font:inherit;font-weight:500;color:var(--fg);background:var(--sec);padding:1px 6px;border-radius:5px;font-size:13px;white-space:nowrap}
.log{border:1px solid var(--border);border-radius:12px;background:var(--card)}
.log .row{padding:14px 16px;border-bottom:1px solid var(--soft)}
.log .row:last-child{border:0}
.log .row b{font-weight:600}
.log .row ul{margin:6px 0 0 18px;color:var(--muted)}
.side{position:sticky;top:76px;align-self:start;display:grid;gap:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.panel .big{font-size:13px;color:var(--faint)}
.panel .ver{font-size:18px;font-weight:600;margin:2px 0 12px;display:flex;gap:8px;align-items:center}
.panel .btn{width:100%;justify-content:center}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--soft);font-size:13px}
.kv span:first-child{color:var(--faint)}
.vers{width:100%;border-collapse:collapse;font-size:13px}
.vers td{padding:9px 0;border-top:1px solid var(--soft)}
.vers td:last-child{text-align:right}
.vers tr:first-child td{border:0}
.vers a{color:var(--faint);transition:.15s}
.vers a:hover{color:var(--fg)}
.vers .d{color:var(--faint)}
.chart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px}
.chart-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.chart-head b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.chart-head span{color:var(--faint);font-size:13px}
.chart-head .up{color:var(--ok)}
.plot{position:relative;margin-left:44px;height:220px;cursor:crosshair;touch-action:pan-y}
.plot svg{display:block;width:100%;height:100%;overflow:visible}
.yax{position:absolute;left:-44px;top:0;bottom:0;width:36px}
.yax span{position:absolute;right:0;transform:translateY(-50%);font-size:11px;color:var(--faint)}
.xax{position:relative;margin-left:44px;height:22px;margin-top:8px}
.xax span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--faint);white-space:nowrap}
.xax span:first-child{transform:none}.xax span:last-child{transform:translateX(-100%)}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--border);opacity:0;transition:opacity .15s;pointer-events:none}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--fg);border:2px solid var(--card);box-sizing:content-box;transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;pointer-events:none}
.ctip{position:absolute;top:0;min-width:230px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;box-shadow:0 8px 24px rgb(0 0 0/.25);z-index:2}
.plot.hover .guide,.plot.hover .dot{opacity:1}
.plot.hover .ctip{opacity:1;transform:none}
.ctip .d{color:var(--faint);font-size:12px}
.ctip .sum{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}
.ctip .sum b{font-size:18px;font-weight:600}
.delta{font-size:12px;font-weight:500;color:var(--ok)}
.delta.neg{color:var(--warn)}
.delta.zero{color:var(--faint)}
.ctip .row{display:grid;grid-template-columns:16px 1fr auto 44px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.ctip .row i{color:var(--faint);font-size:11px}
.ctip .row .v{font-weight:500}
.ctip .row .delta{text-align:right;font-size:11.5px}
.ctip .warn{margin-top:8px;padding-top:8px;border-top:1px solid var(--soft);color:var(--faint);font-size:12px;display:flex;gap:6px}
.table{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:56px}
.tr{display:grid;grid-template-columns:1fr 140px 110px 160px;padding:0 16px;height:46px;align-items:center;border-top:1px solid var(--soft);transition:.15s}
.tr:first-child{border:0;height:38px;color:var(--faint);font-size:12px}
.tr:not(:first-child):hover{background:var(--sec);cursor:pointer}
.tr .t{display:flex;align-items:center;gap:10px;font-weight:500}
.bar-in{height:4px;border-radius:2px;background:var(--sec);overflow:hidden}
.bar-in div{height:100%;background:var(--fg);opacity:.7}
footer{border-top:1px solid var(--soft);color:var(--faint);font-size:12.5px}
footer .wrap{display:flex;height:56px;align-items:center;gap:16px}
.tip{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:.2s}
.tip.on{opacity:1}
.card:hover{transform:translateY(-2px)}
.card:hover .ico{color:var(--fg);background:color-mix(in srgb,var(--fg) 8%,var(--sec))}
.ico{transition:.2s}
.vers a i{display:inline-block}
@keyframes appear{from{opacity:0}}
.appear{animation:appear .4s ease backwards;animation-delay:calc(var(--i,0)*50ms)}
.card,.panel,.chart,.table,.log,.preview{will-change:transform}
.btn:active,.ghost:active,.pills button:active{transform:scale(.97)}
.btn,.ghost,.pills button{transition:background .15s,color .15s,transform .1s,opacity .15s}
.preview img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.preview:hover img{transform:scale(1.015)}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}
.fill{opacity:0;animation:fade .6s .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:.05}}
.bar-in div{width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.tip{transform:translate(-50%,8px)}
.tip.on{transform:translate(-50%,0)}
.inst{display:grid;gap:12px;padding-bottom:56px}

.inst .panel{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:22px}
.inst .who{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.inst .who b{font-weight:600;font-size:15px;display:block}
.inst .who small{color:var(--faint);font-size:12.5px}
.inst .who .btn{width:auto;justify-content:flex-start;height:30px;font-size:13px;padding:0 12px;margin-top:auto}
.inst .steps{align-content:start}
.note{display:flex;gap:10px;align-items:center;color:var(--faint);font-size:13px;padding:4px 2px}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;opacity:1!important;transition:none!important}}
@media (max-width:820px){.side{order:-1}.pills{overflow-x:auto;max-width:100%;scrollbar-width:none}.pills button{flex-shrink:0}.inst .panel{grid-template-columns:1fr;gap:16px}code{white-space:normal}.cols{grid-template-columns:1fr}.side{position:static}.facts{gap:24px;flex-wrap:wrap}header .bar{flex-wrap:wrap;height:auto;padding-top:10px;gap:12px}nav{order:5;width:100%;margin:0 -10px;padding-bottom:6px;overflow-x:auto}.gh{display:none}.bar{gap:10px}.search{width:100%;margin:0}.toolbar{flex-wrap:wrap}.tr{grid-template-columns:1fr 90px}.tr>:nth-child(3),.tr>:nth-child(4){display:none}.wrap{padding:0 16px}.head{flex-wrap:wrap}.head .act{margin:0;width:100%}}
</style>
</head>

 ru:{nav_catalog:"Скрипты",nav_stats:"Статистика",nav_install:"Установка",hero_title:"Скрипты для Umbrella",hero_text:"Lua-скрипты для Dota 2, приложение MusicUI и скилл для нейросетей. Всё бесплатно, обновляется через релизы на GitHub.",search:"Поиск",all:"Все",lua:"Скрипты",app:"Приложения",skill:"Инструменты",f_scripts:"скриптов",f_dl:"загрузок",f_upd:"обновлено",download:"Скачать",versions:"Версии",about:"Что умеет",install:"Установка",changelog:"Что нового",latest:"Последняя версия",downloads:"Загрузок",released:"Релиз",file:"Файл",all_rel:"Все релизы",source:"Исходник",stats_text:"Загрузки всех релизов по дням, данные из GitHub. Наведи на график, чтобы увидеть день.",since:"с",per_day:"за день",drop:"В этот день часть релизов удалили с GitHub, их загрузки выпали из счёта.",th_script:"Скрипт",th_dl:"Загрузок",th_ver:"Версия",th_share:"Доля",install_text:"Как поставить скрипты и приложение.",copied:"Ссылка скопирована",copy:"Ссылка",kind_lua:"Lua-скрипт",kind_app:"Приложение + скрипт",kind_skill:"Скилл",lang_note:"Язык меню берётся из языка чита, скрипты понимают русский и английский.",

const url=(s,v)=>`${REPO}/releases/download/${s.tag}-v${v}/${(s.versions.find(x=>x.v===v)||s).file}`
const isBeta=v=>/beta|rc|alpha/.test(v)
const verChip=v=>`<span class="chip ${isBeta(v)?"beta":""}">v${v}</span>`

function card(s){
  return `<a class="card" href="#/s/${s.id}">
    <div class="top"><div class="ico"><i class="fa-solid ${icon(s.id)}"></i></div><div><h3>${s.title}</h3><div class="kind">${t("kind_"+s.kind)}</div></div>
    <span style="margin-left:auto;display:flex;gap:6px">${verChip(s.last.v)}</span></div>
    <p>${s[lang].tagline[0].toUpperCase()+s[lang].tagline.slice(1)}</p>
    <div class="meta"><span><i class="fa-regular fa-calendar"></i>${fd(s.last.date)}</span><span><i class="fa-solid fa-code-branch"></i>${s.versions.length}</span>
    <span class="dl"><i class="fa-solid fa-arrow-down" style="color:var(--faint)"></i>${nf(s.total)}</span></div></a>`
}
function renderCatalog(){
  const total=items.reduce((a,s)=>a+s.total,0)
  const upd=items.map(s=>s.last.date).sort().pop()
  facts.innerHTML=[[items.length,t("f_scripts"),1],[total,t("f_dl"),1],[fd(upd),t("f_upd")]].map(([v,k,n])=>`<div class="fact"><div class="v" ${n?`data-count="${v}"`:""}>${n?0:v}</div><div class="k">${k}</div></div>`).join("")
  countUp()
  filters.innerHTML=["all","lua","app","skill"].map(k=>`<button data-f="${k}" class="${filter===k?"on":""}">${t(k)}</button>`).join("")
  const list=items.filter(s=>(filter==="all"||s.kind===filter)&&(s.title+s.ru.tagline+s.en.tagline).toLowerCase().includes(query))
  grid.innerHTML=list.map((s,i)=>card(s).replace('class="card"',`class="card appear" style="--i:${i}"`)).join("")||`<p style="color:var(--faint)">—</p>`
}
let counted=false
function countUp(){
  document.querySelectorAll("[data-count]").forEach(e=>{
    const to=+e.dataset.count
    if(counted){e.textContent=nf(to);return}
    const t0=performance.now()
    const step=now=>{const k=Math.min(1,(now-t0)/900),v=Math.round(to*(1-Math.pow(1-k,3)));e.textContent=nf(v);if(k<1)requestAnimationFrame(step)}
    requestAnimationFrame(step)
  })
  counted=true
}
function changelog(md){
  if(!md)return ""
  const parts=md.split(/\n(?=\*\*)/).slice(0,3).map(b=>{
    const lines=b.trim().split("\n").filter(Boolean)
    const h=lines.shift().replace(/\*\*/g,"")
    const li=lines.filter(l=>l.startsWith("-")).map(l=>"<li>"+l.slice(1).trim().replace(/\*\*(.+?)\*\*/g,"<b style='color:var(--fg);font-weight:500'>$1</b>")+"</li>").join("")
    return `<div class="row"><b>${h}</b><ul>${li}</ul></div>`
  }).join("")
  return `<div class="block"><h2>${t("changelog")}</h2><div class="log appear" style="--i:3">${parts}</div></div>`
}
function renderScript(id){
  const s=items.find(x=>x.id===id); if(!s)return
  const d=s[lang]
  const steps=T[lang].steps[s.kind].map(x=>`<li><span>${x.replace("{f}",s.file)}</span></li>`).join("")
  document.getElementById("p-script").innerHTML=`
  <div class="crumb"><a href="#/">${t("nav_catalog")}</a><i class="fa-solid fa-chevron-right" style="font-size:9px"></i><span>${s.title}</span></div>
  <div class="head"><div class="ico"><i class="fa-solid ${icon(s.id)}"></i></div>
    <div><h1>${s.title}${verChip(s.last.v)}</h1><p>${d.tagline[0].toUpperCase()+d.tagline.slice(1)}</p></div>
    </div>
  <div class="cols"><div>
    ${s.preview?`<div class="preview appear" style="--i:0"><img src="previews/${s.id}.png" alt="${s.title}"></div>`:""}
    <div class="block"><h2>${t("about")}</h2><p class="lead">${d.about}</p><ul class="feat">${d.features.map((f,i)=>`<li><i class="fa-solid fa-check"></i><span>${f[0].toUpperCase()+f.slice(1)}</span></li>`).join("")}</ul></div>
    <div class="block"><h2>${t("install")}</h2><ol class="steps">${steps}</ol><p style="color:var(--faint);margin-top:12px;font-size:13px">${t("lang_note")}</p></div>
    ${changelog(s.changelog[lang])}
  </div>
  <aside class="side">
    <div class="panel appear" style="--i:1"><div class="big">${t("latest")}</div><div class="ver">v${s.last.v}</div>
      <div style="display:flex;gap:8px"><a class="btn primary" style="flex:1" href="${url(s,s.last.v)}"><i class="fa-solid fa-download"></i>${t("download")}</a><button class="btn outline" style="width:34px;padding:0;justify-content:center" title="${t("copy")}" data-copy="${url(s,s.last.v)}"><i class="fa-solid fa-link"></i></button></div>
      <div style="margin-top:12px"><div class="kv"><span>${t("file")}</span><span>${s.file}</span></div><div class="kv"><span>${t("released")}</span><span>${fd(s.last.date)}</span></div><div class="kv"><span>${t("downloads")}</span><span>${nf(s.total)}</span></div><div class="kv"><span>${t("source")}</span><a href="${REPO}/tree/main/${s.folder}" target="_blank" style="color:var(--muted)">GitHub <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px"></i></a></div></div></div>
    <div class="panel appear" style="--i:2"><div class="big" style="margin-bottom:6px">${t("versions")}</div>
      <table class="vers">${s.versions.map((v,i)=>`<tr><td>${verChip(v.v)}</td><td class="d">${fd(v.date)}</td><td class="d">${nf(v.dl)}</td><td><a href="${url(s,v.v)}" title="${t("download")}"><i class="fa-solid fa-download"></i></a></td></tr>`).join("")}</table>
      <a href="${REPO}/releases?q=${s.tag}&expanded=true" target="_blank" style="display:block;color:var(--faint);font-size:12.5px;margin-top:10px">${t("all_rel")} <i class="fa-solid fa-arrow-right" style="font-size:10px"></i></a></div>
  </aside></div>`
}
function renderStats(){
  const pts=DATA.series,w=1000,h=220,last=pts[pts.length-1],first=pts[0]
  const step=500,max=Math.ceil(Math.max(...pts.map(p=>p[1]))*1.05/step)*step
  const X=i=>i/(pts.length-1)*w,Y=v=>h-v/max*h
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ")
  const ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v)
  const grid=ticks.map(v=>`<line x1="0" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--soft)" vector-effect="non-scaling-stroke"/>`).join("")
  svg.innerHTML=`${grid}<path class="fill" d="${line} L${w} ${h} L0 ${h}Z" fill="var(--fg)"/><path class="draw" pathLength="1" style="--len:1" d="${line}" fill="none" stroke="var(--fg)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`
  yax.innerHTML=ticks.map(v=>`<span style="top:${Y(v)/h*100}%">${nf(v)}</span>`).join("")
  const every=Math.ceil(pts.length/6)
  xax.innerHTML=pts.map((p,i)=>i===0||i===pts.length-1||(i%every===0&&pts.length-1-i>every/2)?`<span style="left:${X(i)/w*100}%">${fd(p[0])}</span>`:"").join("")
  const grow=last[1]-first[1]
  chead.innerHTML=`<b>${nf(last[1])}</b><span>${t("f_dl")}</span><span class="up">+${nf(grow)}</span><span>${t("since")} ${fd(first[0])}</span>`
  const delta=(n,o)=>{const d=n-o;return `<span class="delta ${d<0?"neg":d===0?"zero":""}">${d>0?"+":d<0?"−":"±"}${nf(Math.abs(d))}</span>`}
  const show=i=>{
    const p=pts[i],prev=pts[i-1],x=X(i)/w*plot.clientWidth,y=Y(p[1])/h*plot.clientHeight
    guide.style.left=x+"px";dot.style.left=x+"px";dot.style.top=y+"px"
    const rows=[...new Set([...Object.keys(p[2]),...Object.keys(prev?prev[2]:{})])].map(id=>[id,p[2][id]||0]).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{const s=items.find(x=>x.id===id);return `<div class="row"><i class="fa-solid ${icon(id)}"></i><span>${s?s.title:id}</span><span class="v">${nf(v)}</span>${prev?delta(v,prev[2][id]||0):"<span></span>"}</div>`}).join("")
    const day=new Date(p[0]+"T00:00:00Z").toLocaleDateString(lang==="ru"?"ru-RU":"en-US",{weekday:"short",day:"numeric",month:"long"})
    ctip.innerHTML=`<div class="d">${day}</div><div class="sum"><b>${nf(p[1])}</b>${prev?delta(p[1],prev[1])+`<span class="d">${t("per_day")}</span>`:""}</div>${rows}${prev&&p[1]<prev[1]?`<div class="warn"><i class="fa-solid fa-circle-info"></i><span>${t("drop")}</span></div>`:""}`
    const tw=ctip.offsetWidth,left=x+16+tw>plot.clientWidth?x-16-tw:x+16
    ctip.style.left=Math.max(0,Math.min(left,plot.clientWidth-tw))+"px"
  }
  const at=e=>{const b=plot.getBoundingClientRect();return Math.round(Math.min(1,Math.max(0,(e.clientX-b.left)/b.width))*(pts.length-1))}
  plot.onpointermove=e=>{plot.classList.add("hover");if(at(e)!==plot.idx){plot.idx=at(e);show(plot.idx)}}
  plot.onpointerleave=()=>{plot.classList.remove("hover");plot.idx=-1}
  plot.onpointerdown=plot.onpointermove
  const total=items.reduce((a,s)=>a+s.total,0), top=Math.max(...items.map(s=>s.total))
  stable.innerHTML=`<div class="tr"><span>${t("th_script")}</span><span>${t("th_dl")}</span><span>${t("th_ver")}</span><span>${t("th_share")}</span></div>`+
   [...items].sort((a,b)=>b.total-a.total).map((s,i)=>`<a class="tr" style="--i:${i}" href="#/s/${s.id}"><span class="t"><i class="fa-solid ${icon(s.id)}" style="color:var(--faint);width:16px"></i>${s.title}</span><span>${nf(s.total)}</span><span>${verChip(s.last.v)}</span><span style="display:flex;gap:10px;align-items:center"><div class="bar-in" style="flex:1"><div data-w="${s.total/top*100}"></div></div><span style="color:var(--faint);font-size:12px;width:34px;text-align:right">${Math.round(s.total/total*100)}%</span></span></a>`).join("")
  requestAnimationFrame(()=>requestAnimationFrame(()=>stable.querySelectorAll("[data-w]").forEach((e,i)=>{e.style.transitionDelay=i*50+150+"ms";e.style.width=e.dataset.w+"%"})))
}
function renderInstall(){
    installcols.innerHTML=["lua","app","skill"].map((k,idx)=>{
    const s=items.find(x=>x.kind===k)
    const lua=k==="lua"
    const name=lua?t("lua"):s.title
    const go=lua?`<a class="btn outline" href="#/">${t("nav_catalog")}<i class="fa-solid fa-arrow-right" style="font-size:11px"></i></a>`:`<a class="btn outline" href="${url(s,s.last.v)}"><i class="fa-solid fa-download"></i>${s.file}</a>`
    return `<div class="panel appear" style="--i:${idx}"><div class="who"><div style="display:flex;gap:12px;align-items:center"><div class="ico"><i class="fa-solid ${lua?"fa-file-code":icon(s.id)}"></i></div><div><b>${name}</b><small>${t("kind_"+k)}</small></div></div>${go}</div>
    <ol class="steps">${T[lang].steps[k].map(x=>`<li><span>${x.replace("{f}",lua?"*.lua":s.file)}</span></li>`).join("")}</ol></div>`
  }).join("")+`<div class="note"><i class="fa-solid fa-language"></i><span>${t("lang_note")}</span></div>`
}
function route(){
  const h=location.hash.slice(1)||"/"
  let page="catalog"
  if(h.startsWith("/s/")){page="script";renderScript(h.slice(3));scrollTo(0,0)}
  else if(h==="/stats"){page="stats";renderStats()}
  else if(h==="/install"){page="install";renderInstall()}
  else renderCatalog()
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==="p-"+page))
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===(page==="script"?"catalog":page)))
}
function i18n(){
  document.documentElement.lang=lang
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i))
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph))
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang))
  route()
}
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]"); if(f){wake();filter=f.dataset.f;renderCatalog()}
  const l=e.target.closest("[data-l]"); if(l&&l.dataset.l!==lang)setLang(l.dataset.l)
  const c=e.target.closest("[data-copy]"); if(c){navigator.clipboard?.writeText(c.dataset.copy);tip.querySelector("span").textContent=t("copied");tip.classList.add("on");setTimeout(()=>tip.classList.remove("on"),1600)}
})
q.addEventListener("input",()=>{wake();query=q.value.toLowerCase();renderCatalog()})
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches
function knob(){
  const on=document.querySelector("#lang button.on"),k=document.querySelector("#lang .knob")
  k.style.width=on.offsetWidth+"px";k.style.transform=`translateX(${on.offsetLeft-2}px)`
}
function setLang(next){
  lang=next
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang))
  knob()
  if(reduced){i18n();return}
  clearTimeout(setLang.t)
  ;(setLang.anims||[]).forEach(a=>a.cancel())
  const out=textNodes().map(([e,d,inl])=>e.animate(inl?[{opacity:1},{opacity:0}]:[{opacity:1,transform:"none"},{opacity:0,transform:"translateY(-4px)"}],{duration:150,delay:d*.35,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"}))
  setLang.anims=out
  setLang.t=setTimeout(()=>{
    document.body.classList.add("calm")
    i18n()
    out.forEach(a=>a.cancel())
    setLang.anims=textNodes().map(([e,d,inl])=>e.animate(inl?[{opacity:0},{opacity:1}]:[{opacity:0,transform:"translateY(5px)"},{opacity:1,transform:"none"}],{duration:380,delay:d,easing:"cubic-bezier(.2,.7,.2,1)",fill:"backwards"}))
  },240)
}
function textNodes(){
  const list=[],picked=new Set()
  const walk=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT})
  while(walk.nextNode()){
    const e=walk.currentNode.parentElement
    if(picked.has(e)||e.closest("#lang,.brand,.tip,svg"))continue
    let up=e.parentElement,inside=false
    while(up){if(picked.has(up)){inside=true;break}up=up.parentElement}
    if(inside)continue
    const b=e.getBoundingClientRect()
    if(!b.width||b.bottom<0||b.top>innerHeight)continue
    picked.add(e)
    list.push([e,Math.max(0,b.top)/innerHeight*160+b.left/innerWidth*40,getComputedStyle(e).display==="inline"])
  }
  return list
}
function wake(){document.body.classList.remove("calm")}
function setThemeIcon(){theme.innerHTML=`<i class="fa-solid fa-${document.documentElement.classList.contains("dark")?"moon":"sun"}"></i>`}
theme.onclick=()=>{
  const d=document.documentElement
  theme.classList.add("spin")
  const flip=()=>{d.classList.toggle("dark");setThemeIcon();requestAnimationFrame(()=>theme.classList.remove("spin"))}
  if(reduced||!document.startViewTransition){setTimeout(flip,150);return}
  const b=theme.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2
  d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px")
  d.style.setProperty("--r",Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+"px")
  setTimeout(()=>document.startViewTransition(flip),120)
}
addEventListener("hashchange",()=>{wake();route()})
i18n()
knob()
addEventListener("resize",knob)
document.fonts?.ready.then(knob)
</script>
</body>
</html>
