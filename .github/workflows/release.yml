name: release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: notes
        id: notes
        run: python .github/release_notes.py "$GITHUB_REF_NAME"

      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.found == 'true'
        with:
          files: scripts/${{ steps.notes.outputs.id }}/${{ steps.notes.outputs.file }}
          name: ${{ steps.notes.outputs.title }} ${{ steps.notes.outputs.version }}
          body_path: body.md
