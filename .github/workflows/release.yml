name: release

on:
  push:
    tags: ["*-v*", "!umbrella-lua-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, e.g. draft-helper-v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: notes
        id: notes
        run: python .github/release_notes.py "$TAG"

      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.found == 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.notes.outputs.path }}
          name: ${{ steps.notes.outputs.title }} ${{ steps.notes.outputs.version }}
          body_path: body.md
