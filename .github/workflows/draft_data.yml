name: draft data

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install numpy

      - name: previous
        run: |
          git clone --depth 1 --branch draft-data "https://github.com/${GITHUB_REPOSITORY}.git" data || mkdir -p data
          rm -rf data/.git

      - name: build
        run: python .github/draft_data.py data

      - name: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b draft-data
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -q -m "draft data"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" draft-data
