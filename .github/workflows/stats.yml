name: stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: collect and render
        run: python .github/stats.py

      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add stats.jsonl README.md
          git diff --cached --quiet || git commit -m "stats $(date -u +%F)"
          git push
