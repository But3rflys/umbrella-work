name: draft helper

on:
  push:
    tags: ["draft-helper-v*"]

permissions:
  contents: write
  actions: write

concurrency:
  group: draft-helper
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: git
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

      - name: version
        id: version
        run: |
          python .github/draft_helper.py bump "$GITHUB_REF_NAME"
          git add scripts/draft_helper/draft_helper.lua
          if ! git diff --cached --quiet; then
            git commit -m "version"
            git pull --rebase --autostash
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: manifest
        run: |
          python .github/draft_helper.py manifest "$GITHUB_REF_NAME" "${{ steps.version.outputs.sha }}"
          git add scripts/draft_helper/version.json
          if ! git diff --cached --quiet; then
            git commit -m "manifest"
            git pull --rebase --autostash
            git push
          fi

      - name: notes
        id: notes
        run: python .github/release_notes.py "$GITHUB_REF_NAME"

      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.found == 'true'
        with:
          files: ${{ steps.notes.outputs.path }}
          name: ${{ steps.notes.outputs.title }} ${{ steps.notes.outputs.version }}
          body_path: body.md

      - name: readme
        run: gh workflow run readme.yml --ref main
