name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/site.py"
      - ".github/catalog.json"
      - ".github/stats/**"
      - ".github/previews/**"
      - "**/CHANGELOG*.md"
  workflow_run:
    workflows: [readme]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: python .github/site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: pages
        uses: actions/deploy-pages@v4
